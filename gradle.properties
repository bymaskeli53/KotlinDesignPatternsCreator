group = com.github.bymaskeli53.kotlindesignpatternscreator
version = 1.0.1

pluginRepositoryUrl = https://github.com/bymaskeli53/KotlinDesignPatternsCreator

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# Force English locale so libraries that case-fold strings (e.g. JetBrains plugin-structure) don't hit the Turkish-locale dotted-I bug
org.gradle.jvmargs = -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8 -Xmx2g
